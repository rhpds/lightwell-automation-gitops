apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: {{ .Values.tekton.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-edit
  namespace: {{ .Values.tekton.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ .Values.tekton.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
