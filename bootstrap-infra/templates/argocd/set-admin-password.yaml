apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-secret"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-password-setter
subjects:
  - kind: ServiceAccount
    name: argocd-password-setter
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: set-argocd-admin-password
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: argocd-password-setter
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: {{ .Values.jobAnsibleImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # The jobAnsibleImage has no `bcrypt` Python module and no outbound internet
              # to pip install it (confirmed on a live cluster: import fails, pip install
              # fails silently). htpasswd's bcrypt mode ($2y$) is available in this image
              # and verifies identically to $2a$/$2b$ hashes for ArgoCD's login check.
              HASH=$(htpasswd -bnBC 10 "" '{{ .Values.admin.password }}' | sed 's/^://')
              MTIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              oc patch secret argocd-secret -n openshift-gitops \
                -p "{\"data\":{\"admin.password\":\"$(echo -n "$HASH" | base64 -w0)\",\"admin.passwordMtime\":\"$(echo -n "$MTIME" | base64 -w0)\"}}"
              # The OpenShift GitOps operator manages the server deployment — annotation patches
              # get reconciled away. Delete the pod directly to force a password reload.
              oc delete pod -n openshift-gitops -l app.kubernetes.io/name=openshift-gitops-server
