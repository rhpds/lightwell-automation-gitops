deployer:
  domain: apps.cluster-guid.sandbox.opentlc.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

admin:
  password: changeme

gitlab:
  namespace: gitlab
  image: quay.io/redhat-gpte/gitlab:17.4.1
  postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
  redisImage: redis:6.2.6
  rootPassword: changeme
  repos: []

rhtas:
  namespace: lightwell-tas
  channel: stable-v1.4

tpa:
  namespace: lightwell-tpa
  channel: stable-v1.1
  keycloakRealm: trusted-profile-analyzer
  uiClientId: trustify-ui
  storageSize: 20Gi
  dbStorageSize: 5Gi
  postgresImage: docker.io/library/postgres:16-alpine

artifactory:
  namespace: lightwell-artifactory
  image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.98.14
  postgresqlImage: docker.io/library/postgres:16-alpine
  storageSize: 20Gi
  pypiUpstreamRemoteKey: pypi-upstream-remote
  pypiUpstreamRemoteUrl: https://pypi.org
  pypiLightwellRemoteKey: pypi-lightwell-remote
  pypiLightwellRemoteUrl: https://pypi.lightwell.example.com

jenkins:
  namespace: lightwell-jenkins
  image: registry.redhat.io/ocp-tools-4/jenkins-rhel9:v4.17.0-1750853657
  password: changeme
  storageSize: 20Gi

sonarqube:
  namespace: lightwell-sonarqube
  image: docker.io/sonarqube:community
  postgresqlImage: docker.io/library/postgres:16-alpine
  storageSize: 10Gi

quay:
  namespace: lightwell-quay
  channel: stable-3.18

aap:
  namespace: aap
  channel: stable-2.7
  manifestUrl: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip

rhoai:
  namespace: redhat-ods-operator
  channel: stable

tekton:
  namespace: lightwell-tssc
  channel: pipelines-1.21

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:chained-2026-08-05
