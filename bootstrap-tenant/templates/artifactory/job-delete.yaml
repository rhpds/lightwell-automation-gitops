apiVersion: batch/v1
kind: Job
metadata:
  name: delete-artifactory-tenant
  namespace: lightwell-tenant-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: lightwell-tenant-jobs
      restartPolicy: OnFailure
      containers:
        - name: delete-artifactory-tenant
          image: {{ .Values.jobAnsibleImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              AAP_NS="{{ .Values.aap.namespace }}"
              ART_NS="{{ .Values.artifactory.namespace }}"
              HOST="https://artifactory-${ART_NS}.{{ .Values.artifactory.domain }}"
              USERNAME="{{ .Values.username }}"
              VIRTUAL_KEY="{{ .Values.artifactory.virtualRepoKey }}"

              ADMIN_PASS=$(oc get secret aap-admin-password -n "${AAP_NS}" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)
              if [ -z "${ADMIN_PASS}" ]; then
                echo "Admin secret not found, assuming Artifactory already torn down"
                exit 0
              fi

              curl -sk -o /dev/null -u "admin:${ADMIN_PASS}" -X DELETE "${HOST}/artifactory/api/security/permissions/perm-${USERNAME}"
              echo "Deleted permission target perm-${USERNAME} (if it existed)"

              curl -sk -o /dev/null -u "admin:${ADMIN_PASS}" -X DELETE "${HOST}/artifactory/api/repositories/${VIRTUAL_KEY}"
              echo "Deleted virtual repo ${VIRTUAL_KEY} (if it existed)"

              curl -sk -o /dev/null -u "admin:${ADMIN_PASS}" -X DELETE "${HOST}/artifactory/api/security/users/${USERNAME}"
              echo "Deleted user ${USERNAME} (if it existed)"
