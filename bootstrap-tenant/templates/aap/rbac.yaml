apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightwell-tenant-aap-reader
  namespace: {{ .Values.aap.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aap-admin-password"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightwell-tenant-aap-reader-{{ .Values.guid }}
  namespace: {{ .Values.aap.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightwell-tenant-aap-reader
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: lightwell-tenant-{{ .Values.guid }}
