apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightwell-tenant-gitlab-reader
  namespace: {{ .Values.gitlab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["root-user-personal-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightwell-tenant-gitlab-reader-{{ .Values.guid }}
  namespace: {{ .Values.gitlab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightwell-tenant-gitlab-reader
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: lightwell-tenant-{{ .Values.guid }}
